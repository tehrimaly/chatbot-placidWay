services:
  - type: web
    name: placidway-chatbot
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CONTACT_EMAIL
        value: candidate@assessment.com
